name: Bug
description: Something in the army builder is broken
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        Please describe cards and army lists by name only. Do not paste battle card text or army list contents into the issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A share link to the list helps.
      placeholder: |
        1. Open ...
        2. Add ...
        3. See ...
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: The URL where it happened.
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 142 on Android
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drop images here if they help.
