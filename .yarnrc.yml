nodeLinker: node-modules
enableTelemetry: false

# better-sqlite3 builds its native addon in an install script.
enableScripts: true

# sharp's libvips binaries are per-libc optional packages, and the image is node:24-alpine, so an
# install on a glibc CI runner must still fetch the musl ones (ADR 0031).
supportedArchitectures:
  libc:
    - current
    - musl
